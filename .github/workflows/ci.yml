name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # The webapp part is one dependency-free JavaScript file and its tests
      # run under Node's own test runner, so there is nothing to install and no
      # lockfile to cache. Node is still set up explicitly rather than relying
      # on whatever the runner image happens to carry, so a runner change
      # cannot silently move the version the tests run against.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ffmpeg is what makes video and voice work. Without it those tests skip
      # themselves, so CI would be green while never exercising the half of
      # the plugin that converts anything.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Validate the plugin manifest
        run: make manifest

      - name: Vet and build
        run: make check-style

      - name: Test the webapp
        run: make webapp-test

      # The bundle is built before the tests run, because the bundle test
      # inspects the real archive and skips when none exists.
      - name: Build the plugin bundle
        run: make dist

      # -timeout is explicit because Go's default is ten minutes and the suite
      # converts real media. A run that crosses that line is killed with a
      # stack dump that reads like a deadlock rather than "this was slow",
      # which is a misleading way to spend an afternoon.
      - name: Test
        run: go test ./... -race -count=1 -timeout 40m

      - name: Verify the bundle contents
        run: |
          bundle=$(ls dist/*.tar.gz)
          echo "checking $bundle"
          contents=$(tar -tzf "$bundle")
          echo "$contents"
          # Redirect instead of `grep -q`: an early-exiting grep would make the
          # writing side of the pipe die of SIGPIPE, which `pipefail` turns
          # into a failed step.
          echo "$contents" | grep 'plugin.json$' > /dev/null
          echo "$contents" | grep 'server/dist/plugin-linux-amd64$' > /dev/null
          # The webapp bundle is checked here as well as by check-bundle: the
          # manifest declares it, and a bundle that ships without it serves a
          # 404 to every browser and silently loses the record button.
          echo "$contents" | grep 'webapp/dist/main.js$' > /dev/null

      - name: Upload the plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bundle
          path: dist/*.tar.gz
          if-no-files-found: error
